services:
  app:
    build: .
    container_name: money-analytics
    ports:
      - "8080:8080"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      API_KEY_COINGECKO: ${API_KEY_COINGECKO}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      REDIS_HOST: redis
    depends_on:
      - redis

  redis:
    image: redis:latest
    container_name: money-analytics-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data: