spring:
  application:
    name: money-talk-analytics
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.6-flash
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
coingecko:
  api:
    key: ${API_KEY_COINGECKO}
telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN}
  chat-id: ${TELEGRAM_CHAT_ID}

market:
  top-coins: 20
  currency: brl
  thresholds:
    pump-24h: 7.0
    dump-24h: -7.0
    volatility-1h: 3.0
