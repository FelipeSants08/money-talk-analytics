name: Continuous Integration & Deploy

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar e executar testes
        run: ./gradlew clean build

      - name: Login no Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Construir e enviar imagem Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: felipesants08/money-talk-analytics:latest

      - name: Executar Deploy na EC2 via SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            
            docker pull felipesants08/money-talk-analytics:latest

          
            docker stop money-talk-analytics || true
            docker rm money-talk-analytics || true

            
            docker run -d \
            --name money-talk-analytics \
            --network money-network \
            -p 80:8080 \
            -e SPRING_DATA_REDIS_HOST=redis-money \
            -e SPRING_DATA_REDIS_PORT=6379 \
            -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            -e API_KEY_COINGECKO="${{ secrets.API_KEY_COINGECKO }}" \
            -e TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            -e TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}" \
            felipesants08/money-talk-analytics:latest